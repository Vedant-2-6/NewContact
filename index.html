<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vedant Patel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:linear-gradient(180deg,#fff,#f4f4f7);display:flex;justify-content:center;align-items:center;min-height:100svh;padding:20px}
.card{width:min(390px,100%);background:rgba(255,255,255,.75);backdrop-filter:blur(30px);border-radius:34px;padding:24px;border:1px solid rgba(255,255,255,.9);box-shadow:0 20px 60px rgba(0,0,0,.08)}
.photo{width:112px;height:112px;border-radius:50%;display:block;margin:0 auto 18px;object-fit:cover;border:4px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.12)}
h1{text-align:center;font-size:31px;color:#111}
.msg{text-align:center;color:#6e6e73;line-height:1.6;margin-top:10px}
.msg strong{color:#111}
.num{text-align:center;font-size:24px;font-weight:700;color:#007AFF;margin:20px 0 24px}
.save{display:flex;justify-content:center;align-items:center;gap:10px;height:58px;background:#007AFF;color:#fff;text-decoration:none;border-radius:18px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.tile{text-decoration:none;background:#fff;border-radius:20px;padding:18px;text-align:center;color:#111;border:1px solid rgba(0,0,0,.05)}
.tile i{font-size:26px;margin-bottom:10px}
.wa i{color:#25D366}.call i{color:#007AFF}
.label{font-weight:700}.sub{font-size:13px;color:#6e6e73;margin-top:4px}
</style>
</head>
<body>
<div class="card">
<img src="Vedant.jpeg" class="photo" alt="Vedant Patel">
<h1>Vedant Patel</h1>
<div class="msg">
Below is my new phone number.<br>
<strong>My old number will soon be out of service.</strong><br>
Please save my new contact.
</div>
<div class="num">+91 63591 73565</div>
<a class="save" href="Vedant_Patel_Contact.vcf"><i class="fa-solid fa-address-card"></i>Save Contact</a>
<div class="grid">
<a class="tile wa" href="https://wa.me/916359173565"><i class="fa-brands fa-whatsapp"></i><div class="label">WhatsApp</div><div class="sub">Message me</div></a>
<a class="tile call" href="tel:+916359173565"><i class="fa-solid fa-phone"></i><div class="label">Call</div><div class="sub">Phone</div></a>
</div>
</div>
</body>
</html>
